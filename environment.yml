name: madis-data

channels:
  - conda-forge

dependencies:
  # Python
  - python>=3.12
  - pip
  - mamba

  # Build tooling
  - setuptools>=77
  - wheel

  # Runtime dependencies
  - cartopy
  - dask
  - h5netcdf
  - geopandas
  - matplotlib
  - numpy
  - netcdf4
  - pandas
  - python-dateutil
  - requests
  - shapely
  - timezonefinder
  - tqdm
  - xarray

  # Jupyter support
  - jupyter_client
  - jupyter_core
  - notebook
  - ipykernel
  - ipywidgets

  # Development tooling, kept here because setup-dev-env.sh installs .[dev] with --no-deps.
  - pytest
  - pytest-cov
  - ruff
  - pre-commit
