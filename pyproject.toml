[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "madis-data"
version = "0.2.9"
description = "Python toolkit for downloading and processing Meteorological Assimilation Data Ingest System (MADIS) data."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Jan Kazil" }]
dependencies = [
  "cartopy",
  "dask",
  "h5netcdf",
  "geopandas",
  "matplotlib",
  "numpy",
  "netcdf4",
  "pandas",
  "python-dateutil",
  "requests",
  "shapely",
  "timezonefinder",
  "tqdm",
  "xarray",
]

[project.scripts]
build-mesonet-dataset = "madis_data.build_mesonet_dataset:main" # Connects name of executable in $PATH to the python module containing main()
build-metar-dataset = "madis_data.build_metar_dataset:main" # Connects name of executable in $PATH to the python module containing main()

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "pre-commit>=3.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Ensure non-Python assets ship inside the wheel/sdist
[tool.setuptools.package-data]
madis_data = [
    "data/EIA/*.geojson",
    "data/CensusBureau/US_states/*",
    "data/NOAA/*",
    "data/UCAR/*",
]

[tool.ruff]
line-length = 128
target-version = "py311"
extend-exclude = [
    "dist",
    "build",
    "data",
    "demos",
    "docs",
    "experiments",
    "notebooks",
    "plots",
    "results",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "F841", "SIM108"]

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
